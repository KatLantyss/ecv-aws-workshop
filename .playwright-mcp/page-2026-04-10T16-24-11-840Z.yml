        - listitem [ref=e106]: 上傳容器映像至 Amazon ECR
        - listitem [ref=e107]: 建立 Amazon ECS Cluster 並使用 Fargate 部署容器
        - listitem [ref=e108]: 建立 ECS Task Definition 與 Service
        - listitem [ref=e109]: 透過 Application Load Balancer 存取應用
        - listitem [ref=e110]: 整合 Amazon S3 實現雲端物件儲存
        - listitem [ref=e111]: 整合 Amazon RDS（MySQL）實現資料庫存取
