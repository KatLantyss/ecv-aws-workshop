      - paragraph [ref=e97]:
        - text: 情境設定：一款線上遊戲 —
        - strong [ref=e98]: Web 2048
        - text: 即將上線，預期會有大量玩家透過網路存取。開發團隊希望專注在遊戲開發上，不想花時間管理基礎設施，也不想預先投入大量資金，但需要確保應用在部署後能夠彈性擴展。
      - paragraph [ref=e99]:
        - text: 雲端架構師建議使用
        - strong [ref=e100]: Amazon ECS on AWS Fargate
        - text: 來部署這款遊戲。
      - paragraph [ref=e101]: 本工作坊將 Web 2048 遊戲打包成 Docker 容器映像，推送至 Amazon ECR，建立 ECS 叢集，並將容器部署到 AWS Fargate 上運行。接著逐步整合 S3 物件儲存與 RDS 資料庫，打造一套完整的容器化應用架構。
