AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate Workshop - Shared Infrastructure (Instructor deploys once).
  Creates VPC, ALB, ECS Cluster, ECR, RDS, IAM Roles shared by all students.

Parameters:
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password (min 8 chars)

  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Token for Lambda API authentication

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password for instructor dashboard access

Mappings:
  Config:
    VPC:
      CIDR: 10.0.0.0/16
    PublicSubnet1:
      CIDR: 10.0.1.0/24
    PublicSubnet2:
      CIDR: 10.0.2.0/24
    PrivateSubnet1:
      CIDR: 10.0.3.0/24
    PrivateSubnet2:
      CIDR: 10.0.4.0/24

Resources:

  # ==================== VPC ====================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Config, VPC, CIDR]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [Config, PublicSubnet1, CIDR]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [Config, PublicSubnet2, CIDR]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [Config, PrivateSubnet1, CIDR]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !FindInMap [Config, PrivateSubnet2, CIDR]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: ecs-fargate-lab-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ==================== Security Groups ====================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group - shared
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Tasks Security Group - shared
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Security Group - shared
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # ==================== ALB ====================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ecs-fargate-lab-alb
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: 'No lab environment found. Please start your lab first.'

  # ==================== ECS Cluster ====================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ecs-fargate-lab-cluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # ==================== ECR ====================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ecs-fargate-lab-app
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only 30 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ==================== IAM Roles ====================
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-fargate-lab-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: CreateLogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: '*'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-fargate-lab-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                Resource: '*'

  # ==================== RDS ====================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS subnet group - shared
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: ecs-fargate-lab-db
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0

  # ==================== Lab API (Lambda Function URL) ====================
  LabApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-fargate-lab-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LabLifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStacks
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                  - iam:GetRole
                  - iam:GetRolePolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'

  LabApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ecs-fargate-lab-api
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LabApiRole.Arn
      Environment:
        Variables:
          API_TOKEN: !Ref ApiToken
          ADMIN_PASSWORD: !Ref AdminPassword
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import json, boto3

          cfn = boto3.client('cloudformation')

          def handler(event, context):
              headers = {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Methods': 'POST, OPTIONS',
                  'Access-Control-Allow-Headers': 'Content-Type'
              }
              if event.get('requestContext', {}).get('http', {}).get('method') == 'OPTIONS':
                  return {'statusCode': 200, 'headers': headers, 'body': ''}

              import os
              body = json.loads(event.get('body', '{}'))

              token = body.get('token', '')
              if token != os.environ['API_TOKEN']:
                  return respond(403, {'error': 'Invalid token'}, headers)

              action = body.get('action')
              username = body.get('username', '')
              lab = body.get('labName', 'ecs-fargate-lab')
              stack_name = f'{lab}-{username}'

              if action == 'create':
                  try:
                      cfn.create_stack(
                          StackName=stack_name,
                          TemplateURL=body['templateUrl'],
                          Parameters=[
                              {'ParameterKey': 'UserPrefix', 'ParameterValue': username},
                              {'ParameterKey': 'LabName', 'ParameterValue': lab},
                              {'ParameterKey': 'ListenerRulePriority', 'ParameterValue': str(body.get('priority', 1))}
                          ],
                          Capabilities=['CAPABILITY_NAMED_IAM']
                      )
                      return respond(200, {'status': 'CREATE_IN_PROGRESS', 'stackName': stack_name}, headers)
                  except cfn.exceptions.ClientError as e:
                      return respond(400, {'error': str(e)}, headers)

              elif action == 'status':
                  try:
                      res = cfn.describe_stacks(StackName=stack_name)
                      stack = res['Stacks'][0]
                      outputs = {o['OutputKey']: o['OutputValue'] for o in stack.get('Outputs', [])}
                      return respond(200, {'status': stack['StackStatus'], 'outputs': outputs}, headers)
                  except cfn.exceptions.ClientError:
                      return respond(200, {'status': 'NOT_FOUND', 'outputs': {}}, headers)

              elif action == 'delete':
                  try:
                      account_id = os.environ.get('ACCOUNT_ID', '')
                      bucket_name = f'{lab}-{username}-{account_id}'
                      try:
                          s3 = boto3.resource('s3')
                          bucket = s3.Bucket(bucket_name)
                          bucket.objects.all().delete()
                      except Exception:
                          pass
                      cfn.delete_stack(StackName=stack_name)
                      return respond(200, {'status': 'DELETE_IN_PROGRESS'}, headers)
                  except cfn.exceptions.ClientError as e:
                      return respond(400, {'error': str(e)}, headers)

              elif action == 'list':
                  admin_pw = body.get('adminPassword', '')
                  if admin_pw != os.environ['ADMIN_PASSWORD']:
                      return respond(403, {'error': 'Invalid admin password'}, headers)
                  stacks = []
                  paginator = cfn.get_paginator('list_stacks')
                  for page in paginator.paginate(StackStatusFilter=[
                      'CREATE_IN_PROGRESS', 'CREATE_COMPLETE', 'CREATE_FAILED',
                      'DELETE_IN_PROGRESS', 'DELETE_FAILED',
                      'ROLLBACK_COMPLETE', 'ROLLBACK_IN_PROGRESS'
                  ]):
                      for s in page['StackSummaries']:
                          if s['StackName'].startswith(f'{lab}-') and s['StackName'] != lab:
                              stacks.append({
                                  'stackName': s['StackName'],
                                  'status': s['StackStatus'],
                                  'username': s['StackName'].replace(f'{lab}-', '', 1),
                                  'createdAt': s['CreationTime'].isoformat()
                              })
                  return respond(200, {'stacks': stacks}, headers)

              return respond(400, {'error': 'Unknown action'}, headers)

          def respond(code, body, headers):
              return {
                  'statusCode': code,
                  'headers': headers,
                  'body': json.dumps(body, default=str)
              }

  LabApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref LabApiFunction
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
        AllowHeaders:
          - Content-Type

  LabApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LabApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  VPCId:
    Value: !Ref VPC
    Export:
      Name: ecs-fargate-lab-VPCId
  PublicSubnet1:
    Value: !Ref PublicSubnet1
    Export:
      Name: ecs-fargate-lab-PublicSubnet1
  PublicSubnet2:
    Value: !Ref PublicSubnet2
    Export:
      Name: ecs-fargate-lab-PublicSubnet2
  PrivateSubnet1:
    Value: !Ref PrivateSubnet1
    Export:
      Name: ecs-fargate-lab-PrivateSubnet1
  PrivateSubnet2:
    Value: !Ref PrivateSubnet2
    Export:
      Name: ecs-fargate-lab-PrivateSubnet2
  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: ecs-fargate-lab-ClusterName
  ECSClusterArn:
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: ecs-fargate-lab-ClusterArn
  ECRRepositoryUri:
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: ecs-fargate-lab-ECRUri
  ALBArn:
    Value: !Ref ALB
    Export:
      Name: ecs-fargate-lab-ALBArn
  ALBDnsName:
    Value: !GetAtt ALB.DNSName
    Export:
      Name: ecs-fargate-lab-ALBDns
  ALBListenerArn:
    Value: !Ref ALBListener
    Export:
      Name: ecs-fargate-lab-ListenerArn
  ECSSecurityGroup:
    Value: !Ref ECSSecurityGroup
    Export:
      Name: ecs-fargate-lab-ECSSg
  ALBSecurityGroup:
    Value: !Ref ALBSecurityGroup
    Export:
      Name: ecs-fargate-lab-ALBSg
  ECSTaskExecutionRoleArn:
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: ecs-fargate-lab-ExecRoleArn
  ECSTaskRoleArn:
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: ecs-fargate-lab-TaskRoleArn
  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: ecs-fargate-lab-RDSEndpoint
  Region:
    Value: !Ref AWS::Region
  LabApiUrl:
    Value: !GetAtt LabApiFunctionUrl.FunctionUrl
    Export:
      Name: ecs-fargate-lab-ApiUrl
