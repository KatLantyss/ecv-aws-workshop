AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate Workshop - Per-User Lab Resources.
  Each student gets their own Command Host, S3 Bucket, ALB Target Group, and Listener Rule.
  References shared infrastructure via CloudFormation exports.

Parameters:
  UserPrefix:
    Type: String
    AllowedPattern: '[a-z0-9\-]+'
    ConstraintDescription: Lowercase alphanumeric and hyphens only
    Description: Unique prefix for this student (e.g. ws-07)

  InfraStackName:
    Type: String
    Default: ecs-fargate-lab
    Description: Name of the shared infrastructure stack

Resources:

  # ==================== Command Host ====================
  CommandHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${UserPrefix}-command-host-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  CommandHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${UserPrefix}-command-host-profile'
      Roles:
        - !Ref CommandHostRole

  CommandHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${UserPrefix} Command Host SG'
      GroupName: !Sub '${UserPrefix}-command-host-sg'
      VpcId:
        Fn::ImportValue: !Sub '${InfraStackName}-VPCId'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  CommandHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId:
        Fn::ImportValue: !Sub '${InfraStackName}-PublicSubnet1'
      SecurityGroupIds:
        - !Ref CommandHostSecurityGroup
      IamInstanceProfile: !Ref CommandHostInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl enable docker
          systemctl start docker
      Tags:
        - Key: Name
          Value: !Sub '${UserPrefix}-command-host'
        - Key: Workshop
          Value: ecs-fargate-lab
        - Key: User
          Value: !Ref UserPrefix

  # ==================== S3 Bucket ====================
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${UserPrefix}-ecs-fargate-lab-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Workshop
          Value: ecs-fargate-lab
        - Key: User
          Value: !Ref UserPrefix

  # ==================== ALB Target Group + Listener Rule ====================
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${UserPrefix}-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${InfraStackName}-VPCId'
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub '${InfraStackName}-ListenerArn'
      Priority: !Select
        - 0
        - !Split
          - '-'
          - !Select [1, !Split ['ws-', !Ref UserPrefix]]
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Workshop-User
            Values:
              - !Ref UserPrefix
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  CommandHostSessionUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${CommandHost}?region=${AWS::Region}'
  CommandHostId:
    Value: !Ref CommandHost
  S3BucketName:
    Value: !Ref S3Bucket
  TargetGroupArn:
    Value: !Ref TargetGroup
  UserPrefix:
    Value: !Ref UserPrefix
  # Pass-through from infra stack for convenience
  ECSClusterName:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-ClusterName'
  ECRRepositoryUri:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-ECRUri'
  ALBDnsName:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-ALBDns'
  RDSEndpoint:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-RDSEndpoint'
  ECSTaskExecutionRoleArn:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-ExecRoleArn'
  ECSTaskRoleArn:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-TaskRoleArn'
  PublicSubnet1:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-PublicSubnet1'
  PublicSubnet2:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-PublicSubnet2'
  ECSSecurityGroup:
    Value:
      Fn::ImportValue: !Sub '${InfraStackName}-ECSSg'
