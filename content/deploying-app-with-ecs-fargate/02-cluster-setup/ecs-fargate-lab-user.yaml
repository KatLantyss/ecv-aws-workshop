AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECS Fargate Workshop - Per-User Lab Resources.
  Each student gets their own Command Host, S3 Bucket, ALB Target Group, and Listener Rule.
  References shared infrastructure via CloudFormation exports.

Parameters:
  UserPrefix:
    Type: String
    AllowedPattern: '[a-z0-9\-]+'
    ConstraintDescription: Lowercase alphanumeric and hyphens only
    Description: Unique prefix for this student

  LabName:
    Type: String
    Default: ecs-fargate-lab
    Description: Lab name used as resource naming prefix and for importing shared infrastructure exports

Resources:

  # ==================== Command Host ====================
  CommandHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${LabName}-${UserPrefix}-command-host-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  CommandHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${LabName}-${UserPrefix}-command-host-profile'
      Roles:
        - !Ref CommandHostRole

  CommandHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${LabName}-${UserPrefix} Command Host SG'
      GroupName: !Sub '${LabName}-${UserPrefix}-command-host-sg'
      VpcId:
        Fn::ImportValue: !Sub '${LabName}-VPCId'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Allow Command Host to connect to RDS (port 3306)
  RDSIngressFromCommandHost:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub '${LabName}-RDSSg'
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref CommandHostSecurityGroup

  CommandHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId:
        Fn::ImportValue: !Sub '${LabName}-PublicSubnet1'
      SecurityGroupIds:
        - !Ref CommandHostSecurityGroup
      IamInstanceProfile: !Ref CommandHostInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl enable docker
          systemctl start docker
      Tags:
        - Key: Name
          Value: !Sub '${LabName}-${UserPrefix}-command-host'
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

  # ==================== S3 Bucket ====================
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${LabName}-${UserPrefix}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

  # ==================== ALB Target Group ====================
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${LabName}-${UserPrefix}-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${LabName}-VPCId'
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${LabName}-${UserPrefix}-alb'
      Scheme: internet-facing
      Subnets:
        - Fn::ImportValue: !Sub '${LabName}-PublicSubnet1'
        - Fn::ImportValue: !Sub '${LabName}-PublicSubnet2'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${LabName}-ALBSg'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  CommandHostSessionUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${CommandHost}?region=${AWS::Region}'
  CommandHostId:
    Value: !Ref CommandHost
  S3BucketName:
    Value: !Ref S3Bucket
  TargetGroupArn:
    Value: !Ref TargetGroup
  ALBDnsName:
    Value: !GetAtt ALB.DNSName
  UserPrefix:
    Value: !Ref UserPrefix
  # Pass-through from infra stack for convenience
  ECSClusterName:
    Value:
      Fn::ImportValue: !Sub '${LabName}-ClusterName'
  ECRRepositoryUri:
    Value:
      Fn::ImportValue: !Sub '${LabName}-ECRUri'
  RDSEndpoint:
    Value:
      Fn::ImportValue: !Sub '${LabName}-RDSEndpoint'
  ECSTaskExecutionRoleArn:
    Value:
      Fn::ImportValue: !Sub '${LabName}-ExecRoleArn'
  ECSTaskRoleArn:
    Value:
      Fn::ImportValue: !Sub '${LabName}-TaskRoleArn'
  PublicSubnet1:
    Value:
      Fn::ImportValue: !Sub '${LabName}-PublicSubnet1'
  PublicSubnet2:
    Value:
      Fn::ImportValue: !Sub '${LabName}-PublicSubnet2'
  ECSSecurityGroup:
    Value:
      Fn::ImportValue: !Sub '${LabName}-ECSSg'
