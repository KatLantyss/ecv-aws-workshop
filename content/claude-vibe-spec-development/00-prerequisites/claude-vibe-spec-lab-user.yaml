AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Claude Vibe Coding & SDD Workshop - Per-User Lab Resources.
  Each student gets their own EC2 with code-server (browser-based VS Code),
  Claude Code CLI + VS Code Extension pre-installed.
  CloudFront provides valid HTTPS termination so browser WebView / Service Worker
  can load correctly (crypto.subtle requires Secure Context).
  Students authenticate Claude Code via browser OAuth using their own Claude account.
  Students open VS Code via the CloudFront HTTPS URL — no local installation required.

Parameters:
  UserPrefix:
    Type: String
    AllowedPattern: '[a-z0-9\-]+'
    ConstraintDescription: 只能使用小寫英文、數字與連字號
    Description: 學員專屬前綴（例如 ws-01），由講師指定

  LabName:
    Type: String
    Default: claude-vibe-spec-lab
    Description: Lab 名稱，用於資源命名與匯入共用基礎設施



Resources:

  # ==================== IAM Role for EC2 ====================
  WorkshopHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${LabName}-${UserPrefix}-host-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

  WorkshopHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${LabName}-${UserPrefix}-host-profile'
      Roles:
        - !Ref WorkshopHostRole

  # ==================== Security Group ====================
  # 開放 8080 給所有 IP（code-server 有密碼保護，不需要限制來源）
  WorkshopHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${LabName}-${UserPrefix} - code-server 8080 + all outbound'
      GroupName: !Sub '${LabName}-${UserPrefix}-host-sg'
      VpcId:
        Fn::ImportValue: !Sub '${LabName}-VPCId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: code-server HTTP (password protected)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (npm, Claude API, code-server updates)
      Tags:
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

  # ==================== EC2 Workshop Host ====================
  WorkshopHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId:
        Fn::ImportValue: !Sub '${LabName}-PublicSubnet1'
      SecurityGroupIds:
        - !Ref WorkshopHostSecurityGroup
      IamInstanceProfile: !Ref WorkshopHostInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/workshop-init.log) 2>&1
          echo "=== Workshop EC2 Init Start: $(date) ==="

          # ── 系統更新 ──────────────────────────────────────────
          dnf update -y
          dnf install -y --allowerasing git tar gzip

          # ── Node.js 22 LTS ────────────────────────────────────
          curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
          dnf install -y nodejs
          echo "Node.js: $(node --version)"
          echo "npm:     $(npm --version)"

          # ── Claude Code CLI（全域）────────────────────────────
          npm install -g @anthropic-ai/claude-code
          echo "Claude Code: $(claude --version)"

          # ── code-server（瀏覽器版 VS Code）──────────────────
          export HOME=/root
          curl -fsSL https://code-server.dev/install.sh | sh

          # ── code-server 設定檔 ────────────────────────────────
          # cert: false — HTTPS 由 CloudFront 處理，EC2 跑 HTTP 即可
          # 密碼 = UserPrefix（例如 ws-01）
          mkdir -p /home/ec2-user/.config/code-server
          cat > /home/ec2-user/.config/code-server/config.yaml << 'CODESERVER_CONFIG'
          bind-addr: 0.0.0.0:8080
          auth: password
          password: ${UserPrefix}
          cert: false
          CODESERVER_CONFIG

          # ── 環境變數 ──────────────────────────────────────────
          echo "LAB_USER=${UserPrefix}" >> /etc/environment

          # ── ec2-user .bashrc ──────────────────────────────────
          cat >> /home/ec2-user/.bashrc << 'BASHRC'
          export LAB_USER=$(grep LAB_USER /etc/environment | cut -d= -f2)
          BASHRC

          # ── Claude Code CLI onboarding skip ──────────────────
          mkdir -p /home/ec2-user/.claude
          cat > /home/ec2-user/.claude.json << 'CLAUDEJSON'
          {
            "hasCompletedOnboarding": true,
            "autoUpdaterStatus": "disabled"
          }
          CLAUDEJSON
          chmod 600 /home/ec2-user/.claude.json

          # ── code-server systemd service ───────────────────────
          cat > /etc/systemd/system/code-server.service << 'SERVICE'
          [Unit]
          Description=code-server (Browser VS Code via CloudFront HTTPS)
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          EnvironmentFile=/etc/environment
          ExecStart=/usr/bin/code-server --config /home/ec2-user/.config/code-server/config.yaml
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable code-server
          systemctl start code-server

          # ── Claude Code Extension ─────────────────────────────
          sleep 5
          sudo -u ec2-user /usr/bin/code-server \
            --install-extension Anthropic.claude-code \
            --force 2>&1 || echo "Extension install will retry on first launch"

          # ── Lab 工作目錄與範例檔案 ────────────────────────────
          mkdir -p /home/ec2-user/claude-vibe-spec-lab
          cd /home/ec2-user/claude-vibe-spec-lab

          cat > user-auth.js << 'JSEOF'
          const users = [];

          function register(username, password) {
            for (let i = 0; i < users.length; i++) {
              if (users[i].username == username) {
                return false;
              }
            }
            users.push({ username: username, password: password });
            return true;
          }

          function login(username, password) {
            for (let i = 0; i < users.length; i++) {
              if (users[i].username == username) {
                if (users[i].password == password) {
                  return { success: true, token: username + "_token_" + Date.now() };
                }
              }
            }
            return { success: false };
          }

          function getUserData(token) {
            const username = token.split("_token_")[0];
            for (let i = 0; i < users.length; i++) {
              if (users[i].username == username) {
                return users[i];
              }
            }
            return null;
          }

          module.exports = { register, login, getUserData };
          JSEOF

          cat > user-auth-spec.md << 'SPECEOF'
          ## 功能名稱
          使用者認證模組（User Authentication）

          ## 背景與目的
          （請填寫）

          ## 輸入規格

          ### register(username, password)
          - username:
          - password:

          ### login(username, password)
          - username:
          - password:

          ### getUserData(token)
          - token:

          ## 輸出規格

          ### register
          - 成功：
          - 失敗：

          ### login
          - 成功：
          - 失敗：

          ### getUserData
          - 成功：
          - 失敗：

          ## 業務規則
          （請填寫）

          ## 錯誤處理
          （請填寫）

          ## 不在範圍內
          （請填寫）

          ## 測試情境
          1.
          2.
          3.
          SPECEOF

          npm init -y
          npm install --save-dev jest

          mkdir -p /home/ec2-user/claude-vibe-spec-lab/.vscode
          cat > /home/ec2-user/claude-vibe-spec-lab/.vscode/settings.json << 'VSCODE_SETTINGS'
          {
            "editor.fontSize": 14,
            "editor.tabSize": 2,
            "editor.formatOnSave": true,
            "files.autoSave": "afterDelay",
            "files.autoSaveDelay": 1000
          }
          VSCODE_SETTINGS

          mkdir -p /home/ec2-user/.local/share/code-server/User
          cat > /home/ec2-user/.local/share/code-server/User/settings.json << 'GLOBAL_SETTINGS'
          {
            "editor.fontSize": 14
          }
          GLOBAL_SETTINGS

          chown -R ec2-user:ec2-user /home/ec2-user/
          echo "=== Workshop EC2 Init Complete: $(date) ==="

      Tags:
        - Key: Name
          Value: !Sub '${LabName}-${UserPrefix}-host'
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

  # ==================== CloudFront Distribution ====================
  # 每位學員各自一個 CloudFront distribution
  # 提供有效的 *.cloudfront.net HTTPS 憑證，解決 Service Worker SSL 問題
  # WebSocket 支援透過 AllowedMethods + 動態 cache policy 處理
  WorkshopCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${LabName}-${UserPrefix} code-server'
        Enabled: true
        HttpVersion: http2
        Origins:
          - Id: CodeServerOrigin
            # CloudFront 不接受 IP，使用 EC2 Public DNS hostname
            # 格式：ec2-{ip-dashes}.{region}.compute.amazonaws.com
            DomainName: !Sub
              - 'ec2-${DashIp}.${AWS::Region}.compute.amazonaws.com'
              - DashIp: !Join
                  - '-'
                  - !Split
                    - '.'
                    - !GetAtt WorkshopHost.PublicIp
            CustomOriginConfig:
              HTTPPort: 8080
              OriginProtocolPolicy: http-only
              # code-server 使用 WebSocket，需要設定較長的 timeout
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: CodeServerOrigin
          ViewerProtocolPolicy: redirect-to-https
          # 全動態應用，完全不快取
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (AWS managed)
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer (forward all headers/cookies/query)
          # WebSocket upgrade 支援
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          # 允許壓縮（code-server 靜態資源受益明顯）
          Compress: true
        # 不需要自訂 domain，使用 *.cloudfront.net 預設憑證
        # 這個憑證是 AWS 簽發的有效憑證，瀏覽器完全信任，無警告
        PriceClass: PriceClass_100  # 僅使用北美 + 歐洲 edge（成本最低；亞太 workshop 可改 PriceClass_All）
      Tags:
        - Key: Workshop
          Value: !Ref LabName
        - Key: User
          Value: !Ref UserPrefix

Outputs:
  VSCodeUrl:
    Description: 學員用瀏覽器開啟此 URL 進入 VS Code（密碼為 UserPrefix，例如 ws-01）
    Value: !Sub 'https://${WorkshopCloudFrontDistribution.DomainName}'

  CloudFrontDomain:
    Description: CloudFront domain（xxxx.cloudfront.net）
    Value: !GetAtt WorkshopCloudFrontDistribution.DomainName

  LoginPassword:
    Description: VS Code 登入密碼（= UserPrefix）
    Value: !Ref UserPrefix

  SSMSessionUrl:
    Description: 講師排查用 - SSM Session Manager 連線
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${WorkshopHost}?region=${AWS::Region}'

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WorkshopHost

  LabDirectory:
    Description: Lab 工作目錄（在 VS Code 終端機中使用）
    Value: /home/ec2-user/claude-vibe-spec-lab

  InitLogLocation:
    Description: 環境初始化 log（排查用）
    Value: /var/log/workshop-init.log
