<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090f" id="metaThemeColor">
<meta name="description" content="eCloudvalley 雲端技術實戰工作坊 — AWS 容器化、Serverless、基礎架構等 Hands-on Lab">
<meta property="og:title" content="ECV Workshop">
<meta property="og:description" content="eCloudvalley 雲端技術實戰工作坊 — AWS Hands-on Lab">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="">
<meta property="og:image" content="">
<title>ECV Workshop</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/amazon-ember" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  const saved = localStorage.getItem('ws-theme');
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.getElementById('metaThemeColor');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#07090f' : '#f8f9fa');
})();
</script>
</head>
<body>

<a class="skip-link" href="#content">跳至主要內容</a>

<!-- ═══ Header ═══ -->
<header class="header">
  <div class="header-progress"><div class="header-progress-fill" id="progressFill"></div></div>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">☰</button>
  <div class="header-logo">
    <div class="header-logo-icon" id="headerLogo">☁</div>
    <a href="#" id="headerTitle" class="header-title-link" onclick="goHome();return false">ECV Workshop</a>
  </div>
  <div class="header-center">
    <div class="header-breadcrumb" id="breadcrumb"></div>
    <span class="header-progress-text" id="progressText"></span>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
    <button class="admin-logout-btn" id="adminLogoutBtn" onclick="handleAdminLogout()" hidden>登出</button>
    <button class="header-btn" id="prevBtn" onclick="navigatePrev()">← 上一頁</button>
    <button class="header-btn" id="nextBtn" onclick="navigateNext()">下一頁 →</button>
  </div>
</header>

<!-- ═══ Sidebar (workshop reader mode) ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-section">
    <a class="sidebar-back" href="#" onclick="goHome();return false">← 返回</a>
    <div class="sidebar-label" id="sidebarLabel">目錄</div>
    <ul class="sidebar-nav" id="sidebarNav"></ul>
  </div>
  <div class="sidebar-footer" id="sidebarFooter" hidden>
    <div class="sidebar-footer-user">
      <svg class="sidebar-footer-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 14c0-3 2.5-4.5 5.5-4.5s5.5 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="sidebar-user" id="headerUser"></span>
    </div>
    <button class="sidebar-logout" id="logoutBtn" onclick="handleLogout()" aria-label="登出"></button>
  </div>
</aside>

<!-- ═══ Landing page (card grid) ═══ -->
<div class="landing" id="landing" hidden>
  <div class="landing-hero">
    <h1 id="landingTitle">ECV Workshop</h1>
    <p id="landingSubtitle">eCloudvalley 雲端技術實戰工作坊</p>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <footer class="footer" id="landingFooter"></footer>
</div>

<!-- ═══ Workshop reader ═══ -->
<main class="main" id="main" hidden>
  <article class="content" id="content">
    <div class="loading" role="status" aria-live="polite">載入中…</div>
  </article>
  <nav class="toc" id="toc"></nav>
  <div class="content" id="pageNav"></div>
  <footer class="footer" id="footer"></footer>
</main>

<div class="overlay" id="overlay"></div>

<!-- ═══ Unified Entry Screen ═══ -->
<div class="entry-screen" id="joinScreen" hidden>
  <div class="entry-container">
    <div class="entry-brand">
      <div class="entry-logo" id="joinLogo">☁</div>
      <h1 class="entry-title" id="entryTitle">ECV Workshop</h1>
      <p class="entry-subtitle" id="entrySubtitle"></p>
    </div>
    <div class="entry-card">
      <!-- Step 1: Event Code / Admin -->
      <div class="entry-step" id="entryStep1">
        <form class="entry-form" id="joinForm" onsubmit="handleUnifiedEntry(event)" autocomplete="off">
          <label class="entry-label" for="joinCode">Event Code</label>
          <div class="entry-input-row">
            <input type="text" id="joinCode" name="eventcode" required autocomplete="off" spellcheck="false">
            <button class="entry-submit" type="submit" aria-label="Continue">&rarr;</button>
          </div>
          <div class="entry-error" id="joinError" role="alert" aria-live="polite"></div>
        </form>
      </div>
      <!-- Step 2: Username (revealed after event code) -->
      <div class="entry-step entry-step-hidden" id="entryStep2">
        <div class="entry-step2-badge">
          <span class="entry-step2-icon">✓</span>
          <span class="entry-workshop-name" id="entryWorkshopName"></span>
          <button class="entry-change-btn" onclick="entryReset()" aria-label="變更活動代碼">變更</button>
        </div>
        <form class="entry-form" id="entryUserForm" onsubmit="handleUnifiedLogin(event)" autocomplete="off">
          <label class="entry-label" for="loginUser">Username</label>
          <div class="entry-input-row">
            <input type="text" id="loginUser" name="username" required autocomplete="username" spellcheck="false">
            <button class="entry-submit" type="submit" aria-label="Join">&rarr;</button>
          </div>
          <div class="entry-error" id="loginError" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <footer class="entry-footer" id="entryFooter"></footer>
  </div>
</div>

<!-- ═══ Lab Floating Button ═══ -->
<div class="lab-fab" id="labFab" data-state="idle" hidden>
  <div class="lab-fab-collapsed">
    <span class="lab-fab-dot" id="labFabDot"></span>
    <span class="lab-fab-label">Lab</span>
  </div>
  <div class="lab-fab-expanded">
    <div class="lab-fab-header" id="labFabHeader">
      <span>Lab 環境</span>
      <span class="lab-fab-header-dot" id="labFabHeaderDot"></span>
    </div>
    <div class="lab-fab-body" id="labFabBody">
      <div class="lab-fab-idle" id="labFabIdle">
        <button class="lab-fab-deploy-btn" onclick="labDeploy()">部署 Lab 環境</button>
      </div>
      <div class="lab-fab-progress" id="labFabProgress" hidden>
        <div class="lab-fab-spinner"></div>
        <span class="lab-fab-status" id="labFabStatus">建立中...</span>
        <span class="lab-fab-elapsed" id="labFabElapsed"></span>
      </div>
      <div class="lab-fab-outputs" id="labFabOutputs" hidden></div>
      <div class="lab-fab-error" id="labFabError" hidden>
        <span class="lab-fab-error-msg" id="labFabErrorMsg"></span>
        <button class="lab-fab-retry-btn" onclick="labDeploy()">重試</button>
      </div>
    </div>
    <div class="lab-fab-footer" id="labFabFooter" hidden>
      <button class="lab-fab-destroy-btn" onclick="labDestroy()">銷毀環境</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
