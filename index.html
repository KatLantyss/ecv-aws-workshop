<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090f" id="metaThemeColor">
<meta name="description" content="eCloudvalley 雲端技術實戰工作坊 — AWS 容器化、Serverless、基礎架構等 Hands-on Lab">
<meta property="og:title" content="ECV AWS Workshop">
<meta property="og:description" content="eCloudvalley 雲端技術實戰工作坊 — AWS Hands-on Lab">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<title>AWS Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/amazon-ember" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="https://fonts.cdnfonts.com/css/amazon-ember" as="style">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  const saved = localStorage.getItem('ws-theme');
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.getElementById('metaThemeColor');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#07090f' : '#f8f9fa');
})();
</script>
</head>
<body>

<a class="skip-link" href="#content">跳至主要內容</a>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="header-progress"><div class="header-progress-fill" id="progressFill"></div></div>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">☰</button>
  <div class="header-logo">
    <div class="header-logo-icon" id="headerLogo">☁</div>
    <a href="#" id="headerTitle" class="header-title-link" onclick="goHome();return false">ECV AWS Workshop</a>
  </div>
  <div class="header-center">
    <div class="header-breadcrumb" id="breadcrumb"></div>
    <span class="header-progress-text" id="progressText"></span>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>

    <button class="header-btn" id="prevBtn" onclick="navigatePrev()">← 上一頁</button>
    <button class="header-btn" id="nextBtn" onclick="navigateNext()">下一頁 →</button>
  </div>
</div>

<!-- ═══ Sidebar (workshop reader mode) ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-section">
    <a class="sidebar-back" href="#" onclick="goHome();return false">← 回到首頁</a>
    <div class="sidebar-label" id="sidebarLabel">目錄</div>
    <ul class="sidebar-nav" id="sidebarNav"></ul>
  </div>
  <div class="sidebar-footer" id="sidebarFooter" hidden>
    <span class="sidebar-user" id="headerUser"></span>
    <button class="sidebar-logout" id="logoutBtn" onclick="handleLogout()">登出</button>
  </div>
</aside>

<!-- ═══ Landing page (card grid) ═══ -->
<div class="landing" id="landing" role="main">
  <div class="landing-hero">
    <h1 id="landingTitle">ECV AWS Workshop</h1>
    <p id="landingSubtitle">eCloudvalley 雲端技術實戰工作坊</p>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <footer class="footer" id="landingFooter"></footer>
</div>

<!-- ═══ Workshop reader ═══ -->
<main class="main" id="main" hidden>
  <article class="content" id="content">
    <div class="loading" role="status" aria-live="polite">載入中…</div>
  </article>
  <nav class="toc" id="toc"></nav>
  <div class="content" id="pageNav"></div>
  <footer class="footer" id="footer"></footer>
</main>

<div class="overlay" id="overlay"></div>

<!-- ═══ Login Screen ═══ -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-card">
    <div class="login-logo" id="loginLogo">☁</div>
    <h1 class="login-title" id="loginTitle">AWS Workshop</h1>
    <p class="login-subtitle">請輸入講師提供的帳號與活動代碼</p>
    <form class="login-form" id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="login-field">
        <label for="loginUser">使用者名稱</label>
        <input type="text" id="loginUser" name="username" required autocomplete="username" spellcheck="false">
      </div>
      <div class="login-field">
        <label for="loginCode">活動代碼</label>
        <input type="text" id="loginCode" name="eventcode" required autocomplete="off" spellcheck="false">
      </div>
      <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
      <button class="login-btn" type="submit">進入 Workshop</button>
    </form>
    <p class="login-hint">沒有帳號或活動代碼？請聯繫講師取得。</p>
    <a class="login-back" href="#" onclick="cancelLogin();return false">← 返回首頁</a>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
